# Teste: o GitHub Actions consegue baixar a lista de juízes do TJGO?
# Salvar em .github/workflows/teste-tjgo.yml e rodar em Actions > "Teste TJGO" > Run workflow.
name: Teste TJGO

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q curl_cffi
      - name: Baixar a página de 3 jeitos
        run: |
          python - <<'EOF'
          import os, re, urllib.request
          URL = "https://www.tjgo.jus.br/index.php/lista-comarcas-juizes"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          res = []

          def anota(nome, status, pg):
              linhas = len(re.findall(r"<tr", pg or "", re.I))
              ok = status == 200 and linhas > 50
              res.append(f"| {nome} | {status} | {linhas} | {'✅ PASSOU' if ok else '❌ bloqueado'} |")

          try:
              req = urllib.request.Request(URL, headers={"User-Agent": UA, "Accept-Language": "pt-BR,pt;q=0.9"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  anota("urllib (igual ao PC)", r.status, r.read().decode("utf-8", "replace"))
          except Exception as e:
              anota("urllib (igual ao PC)", getattr(e, "code", str(e)[:40]), "")

          from curl_cffi import requests
          for alvo in ("chrome", "safari"):
              try:
                  r = requests.get(URL, impersonate=alvo, timeout=60)
                  anota(f"curl_cffi imitando {alvo}", r.status_code, r.text)
              except Exception as e:
                  anota(f"curl_cffi imitando {alvo}", str(e)[:40], "")

          txt = "### Teste TJGO\n| Método | HTTP | `<tr>` | Resultado |\n|---|---|---|---|\n" + "\n".join(res) + "\n"
          print(txt)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(txt)
          EOF
